name: Build Android test APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/*android*'
      - 'scripts/art/**'
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'tests/**'
      - '*.html'
      - 'package*.json'
      - 'vite.config.*'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - run: npm run android:build
      - run: android/gradlew -p android lintDebug --no-daemon
      - run: python3 scripts/verify-android-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zombie-Bagarre-Android-test
          path: |
            release/*/*Android-test.apk
            release/*/*Android-test.apk.sha256
          if-no-files-found: error
          retention-days: 30
