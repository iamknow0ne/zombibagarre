<!doctype html><html><head><meta charset="utf-8"><title>Zombie Bagarre / Upgrade tiers</title><style>body{margin:12px;background:#142125;color:#eee8d8;font:12px monospace}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#203033;border:1px solid #819484;padding:10px;color:inherit}iframe{display:block;width:1000px;height:820px;border:1px solid #819484;margin-top:12px}output{display:block;height:52px;overflow:auto;padding:10px 0;max-width:950px}</style></head><body><p>UPGRADE TIERS / STAGED BUILD · NO RECORD WRITES</p><nav><button data-action="early">Early choices</button><button data-action="mixed">Mixed tiers</button><button data-action="legendary">Legendary choices</button><button data-action="controller">Controller confirm</button><button id="desktop">Desktop</button><button id="phone">Small phone</button><button id="landscape">Landscape phone</button></nav><output id="report"></output><iframe title="Upgrade game preview" src="/?upgradeQA=1"></iframe><script type="module">const f=document.querySelector('iframe');for(const b of document.querySelectorAll('[data-action]'))b.onclick=()=>f.contentWindow.postMessage({type:'upgrade-qa',action:b.dataset.action},location.origin);for(const [id,w,h]of [['desktop',1000,820],['phone',320,568],['landscape',844,390]])document.getElementById(id).onclick=()=>{f.style.width=w+'px';f.style.height=h+'px';};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===f.contentWindow&&e.data?.type==='upgrade-report')document.getElementById('report').textContent=JSON.stringify(e.data);});</script></body></html>
