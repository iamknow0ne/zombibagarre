<!doctype html><html lang="en"><meta charset="utf-8"><title>SNES input QA</title><style>body{margin:0;background:#182320;color:#e9dfc8;font:12px monospace}button{padding:10px;margin:3px}iframe{width:100%;height:85vh;border:0}</style><nav id="keys"></nav><iframe src="/retro/play.html" title="SNES hardware emulation"></iframe><script type="module">const frame=document.querySelector('iframe');for(const [label,key,code,num,ms]of [['Start','Enter','Enter',13,200],['Fire 3s','s','KeyS',83,3000],['Right 1s','ArrowRight','ArrowRight',39,1000],['Down 1s','ArrowDown','ArrowDown',40,1000],['Left 1s','ArrowLeft','ArrowLeft',37,1000],['Up 1s','ArrowUp','ArrowUp',38,1000],['Switch','e','KeyE',69,200],['Grenade','z','KeyZ',90,200]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{const w=frame.contentWindow;w.focus();const e=type=>new w.KeyboardEvent(type,{key,code,keyCode:num,which:num,bubbles:true});w.document.getElementById('game').dispatchEvent(e('keydown'));setTimeout(()=>w.document.getElementById('game').dispatchEvent(e('keyup')),ms);};document.querySelector('nav').append(b);}const sweep=document.createElement('button');sweep.textContent='Combat sweep 24s (scripted input)';sweep.onclick=()=>{const w=frame.contentWindow,t=w.document.getElementById('game');const key=(key,code,n,down)=>t.dispatchEvent(new w.KeyboardEvent(down?'keydown':'keyup',{key,code,keyCode:n,which:n,bubbles:true}));key('s','KeyS',83,true);const dirs=[['ArrowRight',39],['ArrowDown',40],['ArrowLeft',37],['ArrowUp',38]];for(let i=0;i<16;i++)setTimeout(()=>{const [k,n]=dirs[i%4];key(k,k,n,true);setTimeout(()=>key(k,k,n,false),450);if(i%4===0){key('z','KeyZ',90,true);setTimeout(()=>key('z','KeyZ',90,false),100);}},i*1500);setTimeout(()=>{key('s','KeyS',83,false);key('Enter','Enter',13,true);setTimeout(()=>key('Enter','Enter',13,false),200);},24000);};document.querySelector('nav').append(sweep);</script></html>
