<!doctype html><html><head><meta charset="utf-8"><title>Zombie Bagarre / touch control test</title><style>body{background:#142125;color:#eee8d8;font:12px monospace;margin:12px}nav{display:flex;gap:5px;flex-wrap:wrap}button{background:#263b3c;color:#eee8d8;border:1px solid #819484;padding:7px;cursor:pointer}iframe{display:block;width:390px;height:844px;margin:14px auto;border:1px solid #819484}output{display:block;padding:8px;max-height:90px;overflow:auto;font-size:10px}h1{font-size:13px}.preview-only{margin:0}.preview-only h1,.preview-only nav,.preview-only output{display:none}.preview-only iframe{position:fixed;inset:0;width:100%!important;height:100vh!important;margin:0;border:0}#preview-tools{position:fixed;right:4px;bottom:4px;z-index:3;font-size:9px;padding:3px}</style></head><body><button id="preview-tools">Hide test tools</button><h1>TOUCH QA · SCRIPTED POINTERS · INVULNERABLE · NOT PHONE HARDWARE</h1><nav id="actions"></nav><nav><button id="portrait">390 × 844 portrait</button><button id="landscape">844 × 390 landscape</button><button id="small">320 × 568 small phone</button><button id="hold">Resize during gesture</button></nav><output id="report"></output><iframe src="/?touchQA=1" title="Touch game preview"></iframe><script type="module">
document.getElementById('preview-tools').onclick=()=>document.body.classList.toggle('preview-only');
const frame=document.querySelector('iframe'),actions=['start','notices','busy-hud','move','aim','both','dodge','grenade','cancel','map','pan','pinch','car','drive','drive-left','reverse','brake','pause','reload','swap','auto','arsenal','settings'];for(const name of actions){const b=document.createElement('button');b.textContent=name;b.onclick=()=>frame.contentWindow.postMessage({type:'touch-qa-action',action:name},location.origin);document.querySelector('#actions').append(b);}window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='touch-qa-report')document.querySelector('#report').textContent=JSON.stringify(e.data.value);});for(const [id,w,h]of [['portrait',390,844],['landscape',844,390],['small',320,568]])document.getElementById(id).onclick=()=>{frame.style.width=w+'px';frame.style.height=h+'px';};document.getElementById('hold').onclick=()=>{frame.contentWindow.postMessage({type:'touch-qa-action',action:'both'},location.origin);setTimeout(()=>{frame.style.width='844px';frame.style.height='390px';},300);};
</script></body></html>
