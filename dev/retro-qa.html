<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro QA / Zombie Bagarre</title><style>body{background:#142125;color:#eee8d8;font:12px system-ui;margin:10px}h1{font-size:16px}nav{display:flex;flex-wrap:wrap;gap:5px}button{min-height:36px;background:#263b3c;color:#eee8d8;border:1px solid #819484;padding:8px}iframe{display:block;width:100%;height:800px;margin-top:10px;border:1px solid #819484}output{display:block;font:11px monospace;max-height:48px;overflow:auto}#preview-tools{position:fixed;top:0;right:0;z-index:10;font-size:9px;padding:4px}body.preview-only{margin:0}body.preview-only>h1,body.preview-only>nav,body.preview-only>output,body.preview-only>p{display:none}body.preview-only iframe{width:100%!important;height:100vh!important;margin:0;border:0}</style></head><body><button id="preview-tools">Hide test tools</button><h1>RETRO ROOM / LOCAL QA · NO SAVED PROGRESS</h1><nav id="actions"></nav><nav><button id="phone">Phone 390 × 844</button><button id="landscape">Phone 844 × 390</button><button id="desktop">Desktop</button></nav><p>Local fixtures use the actual game, transition, renderer and input. Placement clears nearby threats; this is not normal-playthrough evidence. The console loads the actual SNES ROM in the same player used by production.</p><output id="report"></output><iframe src="/?retroQA=1" title="Regional travel game preview"></iframe><script type="module">const frame=document.querySelector('iframe');document.getElementById('preview-tools').onclick=()=>document.body.classList.toggle('preview-only');for(const [action,label]of [['start','Start expedition'],['door','Approach retro room (fixture)'],['interact','Interact'],['console','Approach SNES (fixture)'],['locked','Hero level 1 (fixture)'],['unlocked','Hero level 3 (fixture)'],['close','Return from cartridge'],['map','Open map'],['touch','Touch controls']]){const b=document.createElement('button');b.textContent=label;b.onpointerdown=e=>e.preventDefault();b.onclick=()=>frame.contentWindow.postMessage({type:'retro-qa',action},location.origin);document.querySelector('#actions').append(b);}for(const [id,w,h]of [['phone','390px','844px'],['landscape','844px','390px'],['desktop','100%','800px']])document.getElementById(id).onclick=()=>{frame.style.width=w;frame.style.height=h;};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='retro-report')document.getElementById('report').textContent=JSON.stringify(e.data.value);});</script></body></html>
