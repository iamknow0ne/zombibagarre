<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perspective combat QA</title><style>body{margin:0;background:#142125;color:#eee8d8;font:12px monospace}canvas{position:fixed;inset:0}nav,output{position:fixed;z-index:2;left:16px;right:16px;background:#142125ed;padding:12px}nav{top:16px;display:flex;gap:8px;flex-wrap:wrap}output{bottom:16px}button,select{min-height:44px;background:#263b3c;color:#eee8d8;border:1px solid #819484;padding:8px}#reticle{position:fixed;top:50%;left:50%;z-index:1;transform:translate(-50%,-50%);font:20px monospace}</style></head><body><canvas id="game"></canvas><span id="reticle">+</span><nav><span>LOCAL TEST · NO SAVES</span><select id="view" aria-label="Camera"><option value="first">FPS</option><option value="third">TPS</option></select><button data-scene="head">Headshot</button><button data-scene="sky">Aim over target</button><button data-scene="lookup">Look sharply upward</button><button data-scene="downward">Steep downward TPS</button><button data-scene="downward-roof">Steep TPS on roof</button><button data-scene="low">Shoot over low cover</button><button data-scene="wall">Tall cover blocks</button><button data-scene="arc-exposed">Arc exposed head</button><button data-scene="arc-blocked">Arc blocked muzzle</button><select id="weapon" aria-label="Weapon"><option value="marksman">Marksman</option><option value="carbine">Carbine</option><option value="smg">SMG</option><option value="arc">Arc projector</option><option value="shotgun">Shotgun</option><option value="katana">Katana</option><option value="dual">Twin swords</option></select><button id="fire">Fire one round</button><button id="precision" aria-pressed="false">Precision aim</button><button id="walk">Walk and turn</button><button id="reload">Reload</button><label>Gore <input id="gore" type="range" min="0" max="10" value="4" aria-label="Gore intensity"></label><button id="blood">Blood impact</button><button id="death">Fragment death</button></nav><output id="report" role="status">Ready</output><script type="module" src="./perspective-qa.js"></script></body></html>
