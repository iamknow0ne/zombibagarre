<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perspective combat QA</title><style>body{margin:0;background:#142125;color:#eee8d8;font:12px monospace}canvas{position:fixed;inset:0}nav,output{position:fixed;z-index:2;left:16px;right:16px;background:#142125ed;padding:12px}nav{top:16px;display:flex;gap:8px;flex-wrap:wrap}output{bottom:16px}button,select{min-height:44px;background:#263b3c;color:#eee8d8;border:1px solid #819484;padding:8px}#reticle{position:fixed;top:50%;left:50%;z-index:1;transform:translate(-50%,-50%);font:20px monospace}</style></head><body><canvas id="game"></canvas><span id="reticle">+</span><nav><span>LOCAL TEST · NO SAVES</span><select id="view" aria-label="Camera"><option value="first">FPS</option><option value="third">TPS</option></select><button data-scene="head">Headshot</button><button data-scene="sky">Aim over target</button><button data-scene="low">Shoot over low cover</button><button data-scene="wall">Tall cover blocks</button><button id="fire">Fire one round</button></nav><output id="report" role="status">Ready</output><script type="module" src="./perspective-qa.js"></script></body></html>
