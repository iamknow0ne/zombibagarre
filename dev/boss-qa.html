<!doctype html><html><head><meta charset="utf-8"><title>Boss encounter workshop</title><style>body{background:#142125;color:#ede5cf;font:12px monospace;margin:12px}nav{display:flex;flex-wrap:wrap;gap:5px}button{background:#263b3c;color:#ede5cf;border:1px solid #819484;padding:9px}iframe{display:block;width:100%;height:790px;margin-top:12px;border:1px solid #819484}output{display:block;font-size:10px;height:40px;overflow:auto}h1{font-size:16px}</style></head><body><h1>BOSS ENCOUNTER WORKSHOP · DEVELOPMENT ONLY · NO SAVED PROGRESS</h1><nav id="actions"></nav><nav><button id="phone">Phone 390 × 844</button><button id="desktop">Desktop</button></nav><output id="report"></output><iframe src="/?bossQA=1" title="Boss game preview"></iframe><script type="module">const frame=document.querySelector('iframe');for(const [action,label]of [['start','Start expedition'],...['Bell Warden','Dredger','Bloom Mother','Cinder King','Root Cathedral','Avalanche','Ashen Covenant','Fen King'].map((n,i)=>['boss-'+i,n]),['phase','Trigger phase II'],['attack','Next attack'],['pause','Pause / resume'],['vulnerable','Toggle invulnerability'],['heal','Heal'],['defeat','Defeat encounter'],['gun','Equip guns'],['blade','Equip katana']]){const b=document.createElement('button');b.textContent=label;b.onpointerdown=e=>e.preventDefault();b.onclick=()=>frame.contentWindow.postMessage({type:'boss-qa',action},location.origin);document.querySelector('#actions').append(b);}document.getElementById('phone').onclick=()=>{frame.contentWindow.postMessage({type:'boss-qa',action:'touch'},location.origin);frame.style.width='390px';frame.style.height='844px';};document.getElementById('desktop').onclick=()=>{frame.style.width='100%';frame.style.height='790px';};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='boss-report')document.getElementById('report').textContent=JSON.stringify(e.data.value);});</script></body></html>
