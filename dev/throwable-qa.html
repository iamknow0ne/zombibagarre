<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Throwable flight QA</title>
<style>body{margin:0;background:#142125;color:#eee8d8;font:12px monospace}canvas{position:fixed;inset:0}nav,output{position:fixed;z-index:2;left:16px;right:16px;background:#142125ed;padding:12px}nav{top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}output{bottom:16px;white-space:pre-wrap;max-height:26vh;overflow:auto;line-height:1.5}button,select{min-height:44px;background:#263b3c;color:#eee8d8;border:1px solid #819484;padding:8px}button[aria-pressed=true]{border-color:#e3b875;color:#e3b875}label{display:flex;align-items:center;gap:6px}small{width:100%;color:#bec5ae}</style></head>
<body><canvas id="game"></canvas><nav><strong>THROWABLE RANGE · LOCAL TEST · NO SAVES</strong><button data-scene="wall">Wall rebound</button><button data-scene="molotov">Molotov contact</button><button data-scene="low">Clear low cover</button><button data-scene="water">Water landing</button><button data-scene="wet-fire">Fire bottle in water</button><label>Freeze at <select id="freeze"><option value="burst">Burst + 0.08s</option><option value="contact">First contact + 0.03s</option><option value="flight">Mid-flight</option><option value="end">Two seconds</option></select></label><button id="replay">Replay</button><button id="step">Advance 0.1s</button><small>Each scene uses real Simulation input, collision, World rendering and gameplay events. No player profile or saved settings are read or written.</small></nav><output id="report" role="status">Loading range…</output><script type="module" src="./throwable-qa.js"></script></body></html>
