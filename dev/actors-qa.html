<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Bagarre / live character atelier</title><style>
:root{color-scheme:dark;--coal:#182325;--bone:#eee5d2;--brass:#bca578;--line:#66716c}*{box-sizing:border-box}body{margin:0;background:var(--coal);color:var(--bone);font:13px/1.4 system-ui}canvas{display:block;width:100%;height:100dvh}header{position:fixed;inset:12px 12px auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;background:var(--coal);padding:12px;border-left:2px solid var(--brass)}h1{font-size:15px;margin:0}small{display:block;color:#beb9aa;font:10px/1.5 ui-monospace,monospace;letter-spacing:.1em}label{display:flex;gap:6px;align-items:center}button,select{font:inherit;color:var(--bone);background:#263436;border:1px solid var(--line);border-radius:2px;min-height:44px;padding:7px 10px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:3px}footer{position:fixed;inset:auto 12px 12px;padding:10px;background:var(--coal);border-left:2px solid var(--brass);font:11px/1.5 ui-monospace,monospace}#error{color:#ffac8e} @media(max-width:600px){header{inset:6px 6px auto;padding:8px;gap:5px}h1{font-size:13px}small{display:none}label{font-size:11px}button,select{padding:5px}footer{inset:auto 6px 6px;font-size:10px}}
</style></head><body><canvas id="view" aria-label="Production survivor and enemy models. Drag to orbit and scroll to zoom."></canvas>
<header><div><h1>SAINT-ROCH / CHARACTER ATELIER</h1><small>ACTUAL GAME MODELS · NEUTRAL LIGHT · NO SAVE DATA</small></div>
<label>Subject <select id="subject"><option value="scout">Rook</option><option value="medic">Saint</option><option value="biker">Torque</option><option value="ronin">Vesper</option><option value="walker">Walker</option><option value="runner">Runner</option><option value="brute">Brute</option><option value="armored">Armored</option><option value="spitter">Spitter</option><option value="volatile">Volatile</option><option value="survivors">Survivor lineup</option><option value="enemies">Enemy lineup</option></select></label>
<label>Camera <select id="camera"><option value="three">Three-quarter</option><option value="front">Front</option><option value="back">Back</option><option value="face">Face</option><option value="game">Gameplay distance</option></select></label>
<label>Motion <select id="motion"><option value="idle">Idle</option><option value="walk">Walk</option><option value="strafe">Strafe</option><option value="backward">Backpedal</option></select></label><button id="play" aria-pressed="false">Play motion</button><button id="step">Step 1/60 s</button></header>
<footer><span id="stats" role="status">Preparing production models…</span><span id="error" role="alert"></span></footer><script type="module" src="./actors-qa.js"></script></body></html>
