<!doctype html><html><head><meta charset="utf-8"><title>RPG QA / Zombie Bagarre</title><style>body{background:#142125;color:#ede5cf;font:12px monospace;margin:12px}nav{display:flex;flex-wrap:wrap;gap:5px}button{background:#263b3c;color:#ede5cf;border:1px solid #819484;padding:9px}iframe{display:block;width:100%;height:800px;margin-top:12px;border:1px solid #819484}output{display:block;font-size:10px;max-height:60px;overflow:auto}#preview-tools{position:fixed;top:0;right:0;z-index:10;font:9px monospace;padding:3px;background:#142125cc}body.preview-only{margin:0}body.preview-only>h1,body.preview-only>nav,body.preview-only>output{display:none}body.preview-only iframe{width:100%!important;height:100vh!important;margin:0;border:0}</style></head><body><button id="preview-tools">Hide test tools</button><h1>RPG QA · DEVELOPMENT FIXTURES · NO SAVED PROGRESS</h1><nav id="actions"></nav><nav><button id="phone">Phone 390 × 844</button><button id="landscape">Phone landscape 844 × 390</button><button id="desktop">Desktop</button></nav><output id="report"></output><iframe src="/?rpgQA=1" title="RPG game preview"></iframe><script type="module">document.getElementById('preview-tools').onclick=()=>document.body.classList.toggle('preview-only');const frame=document.querySelector('iframe');for(const [action,label]of [['touch','Touch controls'],['start','Start expedition'],['guide-track','Track contact'],['guide-case','Track supply case'],['guide-next','Next quest step'],['guide-anywhere','Fight anywhere'],['guide-pin','Place custom pin'],['guide-arrive','Arrive at objective'],['guide-toggle','Toggle quest direction'],['fund','Fund test character'],['kit','Fill test inventory'],['smith','Visit Mara'],['medic','Visit medic'],['broker','Visit Nocturne'],['case-a','Recover case I'],['case-b','Recover case II'],['contracts','Resolve contract objectives'],['confessor','Visit furnace'],['marshal','Visit chapel'],['defeat','Defeat summoned boss'],['pad-down','Pad down'],['pad-right','Pad right'],['pad-confirm','Pad confirm'],['pad-back','Pad back']]){const b=document.createElement('button');b.textContent=label;b.onpointerdown=e=>e.preventDefault();b.onclick=()=>frame.contentWindow.postMessage({type:'rpg-qa',action},location.origin);document.querySelector('#actions').append(b);}document.getElementById('phone').onclick=()=>{frame.style.width='390px';frame.style.height='844px';};document.getElementById('landscape').onclick=()=>{frame.style.width='844px';frame.style.height='390px';};document.getElementById('desktop').onclick=()=>{frame.style.width='100%';frame.style.height='800px';};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='rpg-report')document.getElementById('report').textContent=JSON.stringify(e.data.value);});</script></body></html>
