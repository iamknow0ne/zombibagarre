<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zombie Bagarre / city generation</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#172427;color:#e7dfc9;font:13px monospace}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #64716b;padding-bottom:16px}h1{margin:0;font:32px Impact,sans-serif;text-transform:uppercase}button,a{color:#edb578}button{padding:12px;background:#293a3d;border:1px solid #778076;font:inherit;cursor:pointer}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}article{border:1px solid #58655e;padding:12px}h2{font:23px Impact,sans-serif;text-transform:uppercase;margin:0 0 8px}canvas{width:100%;height:auto;display:block;margin:12px 0}p{line-height:1.5;margin:8px 0;font-size:11px}small{display:block;margin-top:18px;color:#b1b8ad}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){main{grid-template-columns:1fr}}
</style></head><body><header><div><h1>Four cities. Four street plans.</h1><p>Actual generated layouts · shared by the game, collision and street atlas</p></div><button id="next">NEXT FOUR SEEDS ↗</button></header><main id="cities"></main><small>DEVELOPMENT INSPECTION · NO SAVED PROGRESS IS MODIFIED</small><script type="module">
import {generateCity} from '/src/rebuild/City.js';import {drawAtlas} from '/src/rebuild/Atlas.js';
let seed=20261012;function render(){const main=document.getElementById('cities');main.replaceChildren();for(let i=0;i<4;i++){const layout=generateCity(seed+i),article=document.createElement('article'),b=layout.bounds;article.innerHTML=`<h2>${layout.shape}</h2><p>SEED ${seed+i} · ${b.maxX-b.minX} × ${b.maxZ-b.minZ} m</p><canvas width="500" height="500" aria-label="${layout.shape} street map"></canvas><p>${layout.buildings.length} BUILDING WINGS · ${layout.parcels.length} PLOTS<br>${layout.roads.length} STREET SEGMENTS · ${layout.bridges.length} CROSSINGS</p><a href="/dev/visual-qa.html?scene=city&seed=${seed+i}">Inspect actual 3D city ↗</a>`;main.append(article);const props=[...layout.buildings.map(b=>({...b,kind:'building',health:1})),...layout.cover.map(p=>({...p,health:1}))];drawAtlas(article.querySelector('canvas'),{layout,props,player:{x:0,z:3,angle:0},visited:new Set(),enemies:[],streetEvents:[]},true,{landmarks:false,encounters:false,x:(b.maxX+b.minX)/2,z:(b.maxZ+b.minZ)/2});}}
document.getElementById('next').onclick=()=>{seed+=4;render();};render();
</script></body></html>
